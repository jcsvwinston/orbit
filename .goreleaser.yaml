# GoReleaser builds and publishes the ONE binary this repository ships.
#
# Scope: `server/cmd/admin-server` and nothing else. Orbit is six Go modules,
# but only one of them ships an executable: `server/cmd/admin-server`. The
# other five — the root module (the in-process panel), `agent`, `proto`,
# `quarkbridge` and `quarkdatasource` — are libraries an application links
# into its own binary, so there is no artifact of theirs to sign or to
# download; they are consumed with `go get` and verified by the Go checksum
# database. In particular `agent/` has no `cmd/` at all: it is embedded by
# the host application, never installed as an agent of its own.
#
# The build runs inside the `server` module, not at the repository root — see
# the `dir` key below — and the release workflow only ever runs at the ROOT
# tag (`vX.Y.Z`), never at a module tag such as `server/v0.11.3`.
version: 2

project_name: orbit

builds:
  - id: admin-server
    # `dir` is where the toolchain runs; `main` is relative to it. admin-server
    # lives in the `server` module, whose go.mod is what resolves its imports —
    # building it from the repository root would compile the ROOT module and
    # find no such package.
    dir: server
    main: ./cmd/admin-server
    binary: admin-server
    env:
      - CGO_ENABLED=0
      # The repository is a go.work workspace, and a workspace resolves every
      # sibling import from the local checkout. That is the right thing for
      # development and the wrong thing for a release: it would publish a
      # binary built against code no consumer can resolve. GOWORK=off builds
      # exactly what `go install .../server/cmd/admin-server@<tag>` resolves —
      # the pins server/go.mod actually declares. This is the same reason the
      # `standalone` job in CI sets it.
      - GOWORK=off
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # `admin-server --version` reads its version from build info, which is how
    # a `go install` of the module reports the real tag. A GoReleaser build is
    # a plain `go build` of a checkout, where build info carries no module
    # version, so without this stamp every published binary would report
    # "devel". `.Tag` and not `.Version`: the tag keeps the leading "v", so a
    # downloaded binary and an installed one print the same shape.
    #
    # The symbol is `main.version`, not the package's import path: the Go
    # linker names the main package `main` whatever its import path is, and
    # `-X github.com/jcsvwinston/orbit/server/cmd/admin-server.version=...`
    # is silently ignored — it links, it just leaves the variable empty.
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - id: admin-server
    ids:
      - admin-server
    # Named for the binary, not just for the project: "orbit_1.9.3_linux_amd64"
    # would suggest the archive holds Orbit, and Orbit is mostly a library.
    name_template: "orbit-admin-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per archive. The SBOM pipe runs BEFORE the checksum pipe, so
# the six .spdx.json documents are listed in checksums.txt alongside the six
# archives — which is why signing that one file covers every artifact we
# publish. Neither goreleaser nor goreleaser-action ships syft: the release
# workflow downloads it before this runs, and without it the release fails
# loudly here rather than publishing archives with no SBOM beside them.
sboms:
  - id: archives
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
    cmd: syft
    args:
      - scan
      - "$artifact"
      - --output
      - spdx-json=$document

# Keyless signature over the checksum file. The signing identity is the OIDC
# token GitHub mints for the release job, so there is no key to hold and no
# secret to rotate; what a consumer checks is which workflow, in which
# repository, at which ref produced the signature. Release Please dispatches
# that workflow at the TAG ref, so the identity ends in
# `.../release.yml@refs/tags/vX.Y.Z` — see the verification page under
# website/docs/operations for the command that consumes this.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    certificate: "${artifact}.pem"
    output: true
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"

release:
  # The idempotency guard in the release workflow re-runs GoReleaser when a
  # release carries archives but not the signature, the certificate or the
  # SBOMs. That re-run has to be able to overwrite the assets the failed run
  # already uploaded, or the repair it exists for cannot happen.
  replace_existing_artifacts: true

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  disable: true
