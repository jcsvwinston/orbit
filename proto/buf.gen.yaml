version: v2

# Generated stubs are committed so that:
#   * `go build ./...` works on a fresh checkout without buf installed
#   * the proto module is self-contained and importable
#   * `buf breaking` runs against committed sources
#
# Run `make proto` to regenerate after any change to admin/proto/**/*.proto.
# CI verifies that `make proto` produces no diff (admin-skeleton job).

clean: true

plugins:
  # Go message types
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative

  # Connect-RPC Go bindings (server + client)
  - remote: buf.build/connectrpc/go
    out: gen/go
    opt:
      - paths=source_relative

  # TypeScript stubs for the fleet entry of the ui project (ui/src/fleet/gen):
  # protobuf-es 2 emits the messages AND the service descriptors from one
  # generator (connect-es 2 consumes them), so the connectrpc/es generator of
  # the first generation is gone. The version mirrors @bufbuild/protobuf in
  # ui/package.json; the two move together.
  - remote: buf.build/bufbuild/es:v2.15.0
    out: ../ui/src/fleet/gen
    opt:
      - target=ts
