# Dependabot keeps the six Go modules, the two SPAs and the workflow actions
# current. Go updates are grouped per module so one PR carries a coherent
# bump; Nucleus and Quark are excluded on purpose — those pins are certified
# by the suite's release train (quantum/versions.yaml), not by a bot.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      go-deps: { patterns: ["*"] }
    ignore:
      - dependency-name: github.com/jcsvwinston/nucleus
      - dependency-name: github.com/jcsvwinston/nucleus/*
      - dependency-name: github.com/jcsvwinston/quark
      - dependency-name: github.com/jcsvwinston/quark/*
      - dependency-name: github.com/jcsvwinston/orbit/*
  - package-ecosystem: gomod
    directory: /proto
    schedule: { interval: weekly, day: monday }
    groups:
      go-deps: { patterns: ["*"] }
  - package-ecosystem: gomod
    directory: /agent
    schedule: { interval: weekly, day: monday }
    groups:
      go-deps: { patterns: ["*"] }
    ignore:
      - dependency-name: github.com/jcsvwinston/nucleus
      - dependency-name: github.com/jcsvwinston/nucleus/*
      - dependency-name: github.com/jcsvwinston/orbit/*
  - package-ecosystem: gomod
    directory: /server
    schedule: { interval: weekly, day: monday }
    groups:
      go-deps: { patterns: ["*"] }
    ignore:
      - dependency-name: github.com/jcsvwinston/nucleus
      - dependency-name: github.com/jcsvwinston/nucleus/*
      - dependency-name: github.com/jcsvwinston/orbit/*
  - package-ecosystem: gomod
    directory: /quarkbridge
    schedule: { interval: weekly, day: monday }
    groups:
      go-deps: { patterns: ["*"] }
    ignore:
      - dependency-name: github.com/jcsvwinston/nucleus
      - dependency-name: github.com/jcsvwinston/nucleus/*
      - dependency-name: github.com/jcsvwinston/quark
      - dependency-name: github.com/jcsvwinston/quark/*
      - dependency-name: github.com/jcsvwinston/orbit/*
  - package-ecosystem: gomod
    directory: /quarkdatasource
    schedule: { interval: weekly, day: monday }
    groups:
      go-deps: { patterns: ["*"] }
    ignore:
      - dependency-name: github.com/jcsvwinston/quark
      - dependency-name: github.com/jcsvwinston/quark/*
      - dependency-name: github.com/jcsvwinston/orbit/*
  # The in-process panel's SPA ships a committed dist: a bump here must be
  # followed by `npm ci && npm run build` and a commit of dist/ (CI checks).
  # TypeScript majors stay out of both SPA groups: typescript-eslint 8 pins
  # `typescript >=4.8.4 <6.1.0`, so a grouped bump to TypeScript 7 made
  # `npm ci` fail with ERESOLVE and the whole group unmergeable (#391, #392).
  # It moves by hand when typescript-eslint widens its range.
  - package-ecosystem: npm
    directory: /internal/admin/ui
    schedule: { interval: weekly, day: monday }
    groups:
      npm-deps: { patterns: ["*"] }
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /ui
    schedule: { interval: weekly, day: monday }
    groups:
      npm-deps: { patterns: ["*"] }
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
