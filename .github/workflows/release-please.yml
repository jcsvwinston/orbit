name: Release Please

# F0-9. Watches `main` for Conventional Commit messages and keeps a
# rolling "Release PR" open with the next version bump and the
# CHANGELOG entries derived from the commits since the last tag.
# Merging that PR creates the tag and the GitHub Release.
#
# This automates the version-bump + CHANGELOG portion of the release
# process. The Docusaurus docs-versioning step (`docs:version` +
# `versioned_docs/` snapshot) is NOT covered here — that still lives
# in `.claude/commands/release.md` and runs manually before merging
# the release-please PR. See `CLAUDE.md § "Regla de release"` for the
# full DoD.
#
# Config: `release-please-config.json` + `.release-please-manifest.json`
# at the repo root. release-type is Go (single module).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # The write scopes belong to this job, not to the workflow: the action
    # opens and updates the release PR (pull-requests), cuts the tags and the
    # GitHub Releases, and the matrix refresh below pushes a commit to main
    # (contents). `actions` is what the last step needs to dispatch
    # release.yml — without it that `gh workflow run` returns 403 and the root
    # tag ships with no binaries. A job added later starts from the read-only
    # default above.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        # release-please-action@v4 still declares Node 20 in its
        # action.yml. GitHub forces Node 20 JS actions to Node 24 on
        # 2026-06-02; this env var opts in early so the workflow keeps
        # running through the transition. Remove once the action ships
        # a Node 24 release.
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Runs BEFORE the matrix refresh below on purpose: that step pushes a
      # commit and can fail on its own, and a release whose binaries were
      # never built because a docs table went stale is the worse of the two
      # outcomes.
      #
      # Tags cut by this workflow are created with the GITHUB_TOKEN, and GitHub
      # suppresses events from that token to prevent workflow recursion — so
      # release.yml's `push: tags` trigger NEVER fires for an automatic cut.
      # Chain the asset build explicitly instead; release.yml is idempotent
      # (it re-runs only while the release is missing an archive, an SBOM, the
      # signature, the certificate or the provenance attestation).
      #
      # `release_created` and `tag_name` without a prefix are the ROOT
      # package's outputs — the manifest releaser prefixes every other package
      # with its path (`server--release_created`, `agent--tag_name`, …). That
      # is the whole rule for who publishes binaries: a release round that cuts
      # five module tags and no root tag dispatches nothing, because only the
      # root release has assets. Module tags ship through the Go module proxy;
      # there is no artifact of theirs to build.
      - name: Build release assets for the freshly cut root tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml -R "${{ github.repository }}" --ref "${{ steps.release.outputs.tag_name }}"

      # DX-26 follow-up: close the stale window instead of living with it.
      #
      # The module compatibility matrix is generated from git tags, and a tag
      # does not exist until the release PR merges — the release step above. So main's
      # committed copy went stale at the exact moment a release landed, and
      # the freshness check (which only runs on pull requests) slept until an
      # unrelated PR tripped over it. In a multi-module cascade that means
      # every remaining release PR of the round goes red for a reason that has
      # nothing to do with its own change.
      #
      # The obvious alternative — teaching the generator to read
      # .release-please-manifest.json so the release PR carries its own row —
      # was tried and reverted: in a release PR the manifest already holds the
      # NEW version, so the generator demanded a row the committed file did
      # not have, turning the release PR itself red with no way to fix it
      # (pushing a commit to a release-please branch stops its CI running).
      #
      # Regenerating AFTER the tag is the version that works: the tag exists,
      # the row is correct, and nothing is asked of the release PR.
      # The release-please action does NOT check the repository out — it
      # talks to the API. The refresh below runs git, so it needs a working
      # tree, and it needs the full history plus tags for the generator to
      # see every root release.
      - name: check out for the matrix refresh
        if: steps.release.outputs.releases_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: refresh the module matrix after a release
        if: steps.release.outputs.releases_created == 'true'
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          bash scripts/ci/gen_module_matrix.sh
          if git diff --quiet website/docs/reference/module-matrix.md; then
            echo "module matrix already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/docs/reference/module-matrix.md
          git commit -m "chore(docs): refresh the module matrix after the release tag"
          git push
