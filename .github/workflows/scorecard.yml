name: Scorecard

# OpenSSF Scorecard: a weekly, read-only measurement of this repository's
# supply-chain posture (token permissions, pinned dependencies, branch
# protection, code review, SAST, signed releases, …). It changes nothing; it
# reports. There is no score threshold yet on purpose — the first job of this
# workflow is to produce a number the suite has never had.
#
# The results land in three places. The SARIF is uploaded to code scanning
# (Security → Code scanning, one alert per failing check with its reason) and
# kept as a run artifact — that is where a finding is read. A SARIF carries
# only what failed, though, so it never holds the number: the aggregate is
# taken from the JSON format instead, uploaded as the `scorecard-json`
# artifact and printed as the first heading of the job summary, so the score
# can be read from the run itself without waiting for anything to be published
# anywhere.
#
# `publish_results` is false. Publishing sends the score to the public OpenSSF
# dataset (api.securityscorecards.dev), which is a decision the repository
# owner has not taken; the workflow is written so that flipping it to true is a
# one-line change — `id-token: write` is already granted below, which is the
# permission that publishing needs.

on:
  schedule:
    # Mondays at 04:17 UTC. The minute is arbitrary and deliberately not :00:
    # scheduled workflows queue behind everything else that asks for the hour.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow set rather than adding to it —
    # every scope left out becomes `none` — so the read scopes this job needs
    # are repeated here next to the two writes:
    #   security-events: write  → upload the SARIF to code scanning
    #   id-token: write         → the OIDC token Scorecard uses to publish
    #                             results; harmless while publishing is off,
    #                             and required the day it is turned on
    #   contents: read          → checkout, and Scorecard reading the tree
    #   actions: read           → Scorecard reading workflow runs (CI-Tests)
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Scorecard authenticates with its own token; leaving the checkout
          # credentials in .git/config would hand them to every later step.
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload the SARIF as a run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload the SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: results.sarif

      # A Scorecard SARIF carries only the checks that fall below the action's
      # bundled policy, so it says what is wrong and never what the score is:
      # the 2026-09-08 run produced exactly one finding and no number. The
      # aggregate lives only in the JSON format, and `results_format` takes one
      # value per run — the action analyses once and writes once (`scorecard.Run`
      # then `scorecard.Format` in its main.go), and the only place it formats
      # the same result a second time is inside the `publish_results: true`
      # branch, which also signs that JSON and posts it to the public dataset.
      # That is the decision left untaken above, so the score is bought with a
      # second analysis instead: about fourteen seconds, once a week.
      - name: Run the analysis again for the score
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.json
          results_format: json
          publish_results: false

      - name: Upload the JSON as a run artifact
        # Named the same in quark, nucleus and orbit so a later guard can read
        # the scores without a per-repository special case.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-json
          path: results.json
          retention-days: 5

      - name: Report the score in the run summary
        # The score is not published, so the run has to be readable on its own.
        # Every value comes from the results file; nothing from the event
        # context is interpolated into this shell, which is what keeps the
        # Dangerous-Workflow check where it is. Nothing here fails the job
        # either: there is no approved threshold yet, and producing the number
        # the owner needs in order to pick one is the point of the step.
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json

          try:
              with open("results.json", encoding="utf-8") as handle:
                  data = json.load(handle)
          except Exception as exc:  # the analysis did not get as far as a file
              print("## OpenSSF Scorecard\n")
              print(f"The JSON results could not be read, so there is no score: {exc}")
              raise SystemExit(0)


          def cell(value):
              """One markdown table cell: no newlines, no unescaped pipes."""
              return " ".join(str(value).split()).replace("|", "\\|")


          checks = data.get("checks") or []
          score = data.get("score")
          repo = (data.get("repo") or {}).get("name") or "?"
          commit = ((data.get("repo") or {}).get("commit") or "?")[:12]
          version = (data.get("scorecard") or {}).get("version") or "?"

          print("## OpenSSF Scorecard\n")
          if isinstance(score, (int, float)):
              print(f"### {score:.1f} / 10\n")
          else:
              print("### No aggregate score in the results\n")
          print(f"`{repo}` at `{commit}` — scorecard {version}, {data.get('date', 'unknown date')}\n")
          print("This run measures; it does not gate. No threshold is enforced here.\n")

          if not checks:
              print("The results carry no checks.")
              raise SystemExit(0)


          def rank(check):
              value = check.get("score")
              if isinstance(value, (int, float)) and value >= 0:
                  return (0, value, check.get("name") or "")
              return (1, 0, check.get("name") or "")


          print("| Check | Score | Reason |")
          print("|---|---|---|")
          for check in sorted(checks, key=rank):
              value = check.get("score")
              if isinstance(value, (int, float)) and value >= 0:
                  shown = f"{value:g}/10"
              else:
                  shown = "n/a"
              print(f"| {cell(check.get('name') or '?')} | {shown} | {cell(check.get('reason') or '')} |")

          skipped = [c for c in checks if not isinstance(c.get("score"), (int, float)) or c.get("score") < 0]
          if skipped:
              names = ", ".join(sorted(cell(c.get("name") or "?") for c in skipped))
              print(
                  f"\n`n/a` — the check did not apply to this repository and is left "
                  f"out of the aggregate ({len(skipped)} of {len(checks)}): {names}."
              )
          PY
